<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glow-cyan"></div>

    <div class="container">
        <h1>Currency Converter</h1>

        <div class="form">
            <div class="input-group">
                <label for="fromCurrency">From</label>
                <select id="fromCurrency">
                    <option value="USD">🇺🇸 USD</option>
                    <option value="EUR">🇪🇺 EUR</option>
                    <option value="CNY">🇨🇳 CNY</option>
                    <option value="GBP">🇬🇧 GBP</option>
                    <option value="UAH">🇺🇦 UAH</option>
                    <option value="RUB">🇷🇺 RUB</option>
                    <option value="PLN">🇵🇱 PLN</option>
                </select>
            </div>

            <button type="button" class="swap" id="swap" aria-label="Swap currencies">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/>
                </svg>
            </button>

            <div class="input-group">
                <label for="toCurrency">To</label>
                <select id="toCurrency">
                    <option value="USD">🇺🇸 USD</option>
                    <option value="EUR" selected>🇪🇺 EUR</option>
                    <option value="CNY">🇨🇳 CNY</option>
                    <option value="GBP">🇬🇧 GBP</option>
                    <option value="UAH">🇺🇦 UAH</option>
                    <option value="RUB">🇷🇺 RUB</option>
                    <option value="PLN">🇵🇱 PLN</option>
                </select>
            </div>

            <div class="input-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="0.00" inputmode="decimal">
            </div>

            <button type="button" class="convert" onclick="convertCurrency()">Convert</button>
        </div>

        <p id="result"></p>
    </div>

    <script src="scripts.js"></script>
    <script>
        // Поменять валюты местами (+ пересчитать, если уже введена сумма)
        document.getElementById('swap').addEventListener('click', function () {
            const from = document.getElementById('fromCurrency');
            const to = document.getElementById('toCurrency');
            [from.value, to.value] = [to.value, from.value];
            if (document.getElementById('amount').value) convertCurrency();
        });

        // Анимация появления результата при каждом пересчёте
        const result = document.getElementById('result');
        new MutationObserver(function () {
            result.classList.remove('pop');
            void result.offsetWidth;
            result.classList.add('pop');
        }).observe(result, { childList: true, characterData: true, subtree: true });

        // Подсветка карточки за курсором
        const card = document.querySelector('.container');
        card.addEventListener('pointermove', function (e) {
            const r = card.getBoundingClientRect();
            card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            card.style.setProperty('--my', (e.clientY - r.top) + 'px');
        });
    </script>

</body>
</html>
